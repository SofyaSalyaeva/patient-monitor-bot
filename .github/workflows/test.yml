name: Run tests
on: [push, pull_request]
jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -e . --group=test

      - name: Run tests
        run: |
          pytest tests/ --cov=app
